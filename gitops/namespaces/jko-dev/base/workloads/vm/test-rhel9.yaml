apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test-rhel9
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.medium
  preference:
    kind: VirtualMachineClusterPreference
    name: rhel.9.arm64
  dataVolumeTemplates:
    - metadata:
        name: test-rhel9-rootdisk
      spec:
        source:
          pvc:
            name: rhel9-7005186c23b8
            namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
          storageClassName: crc-csi-hostpath-provisioner
  template:
    metadata:
      labels:
        kubevirt.io/vm: test-rhel9
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: test-rhel9-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: redhat
              chpasswd:
                expire: false
              ssh_pwauth: true
