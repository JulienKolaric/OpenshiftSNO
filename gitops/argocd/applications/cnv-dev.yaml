apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnv-dev
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: jko
    app.kubernetes.io/component: argocd
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JulienKolaric/OpenshiftSNO.git
    targetRevision: main
    path: gitops/cluster/operators/cnv/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-cnv
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /status
    - group: operators.coreos.com
      kind: InstallPlan
      jsonPointers:
        - /status
    - group: hco.kubevirt.io
      kind: HyperConverged
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
